openapi: 3.1.0
info:
  title: Aposenta+ API
  version: 0.3.0
  description: Contrato da autenticação, sincronização opcional e execução futura de projeções no servidor.
servers:
  - url: /api
paths:
  /exchange-rates:
    get:
      summary: Obtém a última cotação pública de referência do BCE
      responses:
        '200':
          description: Taxas com EUR como base, data, fonte e estado de atualização
          content:
            application/json:
              schema:
                type: object
                required: [base, date, fetchedAt, source, sourceUrl, stale, rates]
                properties:
                  base:
                    type: string
                    const: EUR
                  date:
                    type: string
                    format: date
                  fetchedAt:
                    type: [string, 'null']
                    format: date-time
                  source:
                    type: string
                    const: Banco Central Europeu
                  sourceUrl:
                    type: string
                    format: uri
                  stale:
                    type: boolean
                  rates:
                    type: object
                    required: [BRL, EUR, USD, CHF]
  /auth/status:
    get:
      summary: Consulta a configuração e a sessão atual
      responses:
        '200':
          description: Estado da autenticação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
  /auth/register:
    post:
      summary: Solicita a criação de uma conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Solicitação aceita sem revelar se a conta já existe
  /auth/login:
    post:
      summary: Autentica com e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada em cookies HttpOnly
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          description: Credenciais não aceitas
  /auth/recover:
    post:
      summary: Solicita recuperação de acesso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '202':
          description: Solicitação aceita sem revelar se a conta existe
  /auth/logout:
    post:
      summary: Revoga e remove a sessão atual
      responses:
        '200':
          description: Sessão encerrada
  /auth/password:
    post:
      summary: Atualiza a senha durante uma sessão válida de recuperação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '200':
          description: Senha atualizada, sessões revogadas e cookies removidos
        '401':
          description: Sessão ausente ou expirada
        '502':
          description: Senha atualizada, mas a revogação global das sessões não foi confirmada
  /sync/status:
    get:
      summary: Consulta se o usuário possui uma cópia financeira remota
      responses:
        '200':
          description: Estado da cópia remota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
        '401':
          description: Sessão ausente ou expirada
        '503':
          description: API de autenticação ainda não configurada
  /sync/data:
    get:
      summary: Obtém a cópia financeira do usuário autenticado
      responses:
        '200':
          description: Cópia financeira encontrada
          content:
            application/json:
              schema:
                type: object
                required: [state, updatedAt, consentVersion]
                properties:
                  state:
                    $ref: '#/components/schemas/FinancialState'
                  updatedAt:
                    type: string
                    format: date-time
                  consentVersion:
                    type: string
        '401':
          description: Sessão ausente ou expirada
        '404':
          description: Nenhuma cópia encontrada
    post:
      summary: Cria ou atualiza uma cópia após consentimento explícito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [acceptedSyncConsent, consentVersion, state]
              properties:
                acceptedSyncConsent:
                  type: boolean
                  const: true
                consentVersion:
                  type: string
                  const: 2026-09-04-v4
                state:
                  $ref: '#/components/schemas/FinancialState'
      responses:
        '200':
          description: Cópia criada ou atualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [exists, updatedAt, consentVersion]
                properties:
                  exists:
                    type: boolean
                  updatedAt:
                    type: [string, 'null']
                    format: date-time
                  consentVersion:
                    type: string
        '400':
          description: Consentimento ausente ou documento inválido
        '401':
          description: Sessão ausente ou expirada
        '503':
          description: API de autenticação ainda não configurada
    delete:
      summary: Exclui a cópia financeira e o registro de consentimento
      responses:
        '200':
          description: Cópia remota excluída, sem alterar dados locais
        '401':
          description: Sessão ausente ou expirada
  /v1/retirement-goals/{goalId}/projection-runs:
    post:
      summary: Executa uma projeção determinística
      parameters:
        - in: path
          name: goalId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectionRequest'
      responses:
        '200':
          description: Projeção concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionResult'
components:
  schemas:
    AuthStatus:
      type: object
      required: [configured, authenticated]
      properties:
        configured:
          type: boolean
        authenticated:
          type: boolean
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
              format: email
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 128
    RegisterRequest:
      allOf:
        - $ref: '#/components/schemas/LoginRequest'
        - type: object
          required: [acceptedTerms]
          properties:
            password:
              minLength: 12
            acceptedTerms:
              type: boolean
              const: true
    SyncStatus:
      type: object
      additionalProperties: false
      required: [available, exists, updatedAt, consentVersion]
      properties:
        available:
          type: boolean
        exists:
          type: boolean
        updatedAt:
          type: [string, 'null']
          format: date-time
        consentVersion:
          type: [string, 'null']
    FinancialState:
      type: object
      additionalProperties: false
      required: [version, lastUpdatedAt, currency, exchangeRates, customCategories, plan, cashFlow, scenarios]
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 100
        lastUpdatedAt:
          type: [string, 'null']
          format: date-time
        currency:
          type: string
          enum: [BRL, EUR, USD, CHF]
        exchangeRates:
          type: object
        customCategories:
          type: array
          maxItems: 30
          items:
            type: object
        plan:
          type: object
        cashFlow:
          type: object
        scenarios:
          type: array
          maxItems: 3
          items:
            type: object
    ProjectionRequest:
      type: object
      required:
        - assumptionSetVersion
        - targetMonthlyIncome
        - expectedMonthlyBenefit
      properties:
        assumptionSetVersion:
          type: string
          example: BR-2026.09.1
        targetMonthlyIncome:
          type: string
          pattern: '^\\d+\\.\\d{2}$'
          example: '12000.00'
        expectedMonthlyBenefit:
          type: string
          pattern: '^\\d+\\.\\d{2}$'
          example: '4500.00'
    ProjectionResult:
      type: object
      required:
        - projectionRunId
        - calculationVersion
        - assumptionSetVersion
        - amountBasis
        - monthlyIncomeGap
      properties:
        projectionRunId:
          type: string
        calculationVersion:
          type: string
        assumptionSetVersion:
          type: string
        amountBasis:
          type: string
          enum: [REAL_TODAY]
        monthlyIncomeGap:
          type: string
          example: '7500.00'
        warnings:
          type: array
          items:
            type: string
