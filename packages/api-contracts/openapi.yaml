openapi: 3.1.0
info:
  title: Aposenta+ API
  version: 0.2.0
  description: Contrato da autenticação e da execução futura de projeções no servidor.
servers:
  - url: /api
paths:
  /auth/status:
    get:
      summary: Consulta a configuração e a sessão atual
      responses:
        '200':
          description: Estado da autenticação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
  /auth/register:
    post:
      summary: Solicita a criação de uma conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Solicitação aceita sem revelar se a conta já existe
  /auth/login:
    post:
      summary: Autentica com e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada em cookies HttpOnly
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          description: Credenciais não aceitas
  /auth/recover:
    post:
      summary: Solicita recuperação de acesso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '202':
          description: Solicitação aceita sem revelar se a conta existe
  /auth/logout:
    post:
      summary: Revoga e remove a sessão atual
      responses:
        '200':
          description: Sessão encerrada
  /auth/password:
    post:
      summary: Atualiza a senha durante uma sessão válida de recuperação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '200':
          description: Senha atualizada
        '401':
          description: Sessão ausente ou expirada
  /v1/retirement-goals/{goalId}/projection-runs:
    post:
      summary: Executa uma projeção determinística
      parameters:
        - in: path
          name: goalId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectionRequest'
      responses:
        '200':
          description: Projeção concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionResult'
components:
  schemas:
    AuthStatus:
      type: object
      required: [configured, authenticated]
      properties:
        configured:
          type: boolean
        authenticated:
          type: boolean
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
              format: email
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 128
    RegisterRequest:
      allOf:
        - $ref: '#/components/schemas/LoginRequest'
        - type: object
          required: [acceptedTerms]
          properties:
            password:
              minLength: 12
            acceptedTerms:
              type: boolean
              const: true
    ProjectionRequest:
      type: object
      required:
        - assumptionSetVersion
        - targetMonthlyIncome
        - expectedMonthlyBenefit
      properties:
        assumptionSetVersion:
          type: string
          example: BR-2026.09.1
        targetMonthlyIncome:
          type: string
          pattern: '^\\d+\\.\\d{2}$'
          example: '12000.00'
        expectedMonthlyBenefit:
          type: string
          pattern: '^\\d+\\.\\d{2}$'
          example: '4500.00'
    ProjectionResult:
      type: object
      required:
        - projectionRunId
        - calculationVersion
        - assumptionSetVersion
        - amountBasis
        - monthlyIncomeGap
      properties:
        projectionRunId:
          type: string
        calculationVersion:
          type: string
        assumptionSetVersion:
          type: string
        amountBasis:
          type: string
          enum: [REAL_TODAY]
        monthlyIncomeGap:
          type: string
          example: '7500.00'
        warnings:
          type: array
          items:
            type: string
